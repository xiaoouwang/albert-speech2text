# GitLab Pages unique domain (root base):
# https://albert-speech2text-a0896c.gitpages.huma-num.fr/
pages:
  image: node:22
  stage: deploy
  variables:
    VITE_BASE: "/"
    VITE_SITE_URL: "https://albert-speech2text-a0896c.gitpages.huma-num.fr"
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
  script:
    - npm ci
    - npm run build
    - rm -rf public
    - mv dist public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
